<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocuMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>

</head>
<body>

<div class="app">

  <!-- ── Sidebar ───────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">DocuMind</div>
    </div>

    <!-- Upload -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".txt,.pdf" multiple/>
      <span class="upload-icon">📂</span>
      <div class="upload-label">
        <span>Click to upload</span> or drag & drop<br/>
        PDF or TXT files
      </div>
    </div>

    <!-- Progress -->
    <div class="upload-progress" id="uploadProgress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- Doc list -->
    <div class="docs-section">
      <div class="docs-title">Uploaded Documents</div>
      <div id="docList">
        <div class="no-docs">No documents yet.<br/>Upload a file to begin.</div>
      </div>
    </div>

    <!-- Footer actions -->
    <div class="sidebar-footer">
      <button class="btn-ghost" onclick="clearHistory()">🔄 New Chat</button>
      <button class="btn-ghost danger" onclick="deleteAll()">🗑 Clear All</button>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────────── -->
  <main class="main">
    <div class="chat-header">
      <div>
        <div class="chat-header-title">Ask your documents</div>
        <!-- <div class="chat-header-sub">Powered by Cohere command-a + embed-v4 · Reranked retrieval</div> -->
      </div>
      <!-- <div class="status-dot" title="Live"></div> -->
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🧠</div>
        <div class="welcome-title">Chat here</div>
        <p class="welcome-text">
          Upload any PDF or text document on the left, then ask anything about it.
        </p>
        <!-- <div class="welcome-hints">
          <div class="hint-pill" onclick="useHint(this)">Summarize the main points of this document</div>
          <div class="hint-pill" onclick="useHint(this)">What are the key findings or conclusions?</div>
          <div class="hint-pill" onclick="useHint(this)">List all the important dates or deadlines mentioned</div>
        </div> -->
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="question" rows="1" placeholder="Ask a question about your documents…" maxlength="1000"></textarea>
          <span class="char-count" id="charCount">0/1000</span>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendQuestion()" title="Send">➤</button>
      </div>
      <!-- <div class="input-hint">Enter ↵ to send · Shift+Enter for new line</div> -->
    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
